asyncapi: 2.6.0
info:
  title: Open Real Estate — Reference Real Estate Core Platform — Domain Events
  version: 1.0.0
  description: >
    CloudEvents 1.0 envelopes published by the platform's bounded contexts.
    Consumers MUST be idempotent and tolerate unknown fields. Ordering is
    guaranteed only per aggregate (the CloudEvent `subject`).
servers:
  production:
    url: kafka://broker.realestate.svc.cluster.local:9092
    protocol: kafka
    description: Kafka-backed Knative Broker in production; Knative Broker abstraction elsewhere.
channels:
  property.created:
    publish:
      operationId: on-property-created
      message: { $ref: '#/components/messages/Generic' }
  escrow.created:
    publish:
      operationId: on-escrow-created
      message: { $ref: '#/components/messages/Generic' }
  appraisal.created:
    publish:
      operationId: on-appraisal-created
      message: { $ref: '#/components/messages/Generic' }
  lease.created:
    publish:
      operationId: on-lease-created
      message: { $ref: '#/components/messages/Generic' }
  notification.created:
    publish:
      operationId: on-notification-created
      message: { $ref: '#/components/messages/Generic' }
  propertyrisk.evaluated:
    publish:
      operationId: on-propertyrisk-evaluated
      message: { $ref: '#/components/messages/Generic' }
  portfolio.evaluated:
    publish:
      operationId: on-portfolio-evaluated
      message: { $ref: '#/components/messages/Generic' }
components:
  messages:
    Generic: { payload: { $ref: '#/components/schemas/CloudEvent' } }
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string, format: uuid }
        source: { type: string, example: '/open-real-estate/service' }
        type: { type: string, example: 'context.event' }
        subject: { type: string, description: Aggregate id (ordering key). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }
        data: { type: object }
