openapi: 3.1.0
info:
  title: Open Real Estate — Reference Real Estate Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /properties:
    post:
      operationId: create-property
      summary: "Property registry; the land-registry reference is masked at listing."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /escrow:
    post:
      operationId: create-escrow
      summary: "Guarded escrow accounts per property transaction and the releases against them."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /appraisal-rules:
    post:
      operationId: create-appraisal
      summary: "Decision rules binding property types to value caps and valuation-gap envelopes."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /lease-templates:
    post:
      operationId: create-lease
      summary: "Lease template catalogue by type and term."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
